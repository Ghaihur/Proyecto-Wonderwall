<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9XL1W5357X"></script>

    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag(){
        dataLayer.push(arguments);
    }   

gtag("js", new Date());

gtag("config", "G-9XL1W5357X");

<body>

<main class="app">

    <!-- Pantalla inicial -->

    <section class="welcome-screen">

        <button id="enterButton">
            Entrar
        </button>

    </section>

    <button id="skipButton">
        Saltar animación
    </button>  

    <!-- Carta -->

    <section class="letter-screen hidden">

        <div class="letter">

            <div id="letterText"></div>

        </div>

        <button id="finishButton" class="hidden">
            Terminé de leer
        </button>

    </section>

    <!-- Pantalla final -->

    <section class="response-screen hidden">

        <div class="final-card">

            <p>
                Cuando estés lista para hablar,
                apretá acá abajo.
            </p>

        </div>

        <button id="hereButton">
            Aquí
        </button>

    </section>

</main>

<script src="js/letter.js"></script>
<script src="js/app.js"></script>
